name: BULLET CI/CD & Verification Suite

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Tag (e.g. v0.0.3)'
        required: true
        default: 'v0.0.3'
      create_release:
        description: 'Publish GitHub Release with standalone desktop package'
        type: boolean
        required: true
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Hygiene & Type Validation
    if: github.event_name != 'workflow_dispatch' || github.actor == 'VishalViswanathan03'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore .NET Solution Dependencies
        run: dotnet restore Bullet.slnx

      - name: Verify C# Build & Compilation
        run: dotnet build Bullet.slnx --configuration Release --no-restore

      - name: Install Frontend Dependencies
        working-directory: src/Bullet.Web
        run: npm install

      - name: Build & Validate Frontend Bundle
        working-directory: src/Bullet.Web
        run: npm run build

  e2e-click-through-tests:
    name: 36-Phase Automated E2E Browser Suite
    needs: lint-and-format
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Frontend Distribution
        working-directory: src/Bullet.Web
        run: |
          npm install
          npm run build

      - name: Copy Frontend Assets to API Host wwwroot
        shell: pwsh
        run: |
          Copy-Item -Path "src/Bullet.Web/dist/*" -Destination "src/Bullet.Api/wwwroot" -Recurse -Force

      - name: Pre-build Solution for Instant Startup
        run: |
          dotnet build Bullet.slnx --configuration Release

      - name: Execute Full 30-Phase E2E Browser Suite
        working-directory: src/Bullet.Web
        shell: pwsh
        run: |
          node e2e-full-suite.mjs

      - name: Archive E2E Verification Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullet-e2e-screenshots
          path: src/Bullet.Web/e2e-screenshots/*.png
          if-no-files-found: ignore

  docker-verification:
    name: Docker Container Verification
    if: github.event_name != 'workflow_dispatch' || github.actor == 'VishalViswanathan03'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Bullet API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: false
          tags: bullet-api:ci-test

      - name: Build Bullet Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: false
          tags: bullet-web:ci-test

  package-macos:
    name: Package Native macOS DMG Installers
    needs: [lint-and-format, e2e-click-through-tests, docker-verification]
    if: ((github.event_name == 'workflow_dispatch' && (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true || inputs.create_release)) || startsWith(github.ref, 'refs/tags/v')) && (github.actor == 'VishalViswanathan03' || github.triggering_actor == 'VishalViswanathan03')
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Production Frontend Assets
        working-directory: src/Bullet.Web
        run: |
          npm install
          npm run build

      - name: Build & Package Apple Silicon (ARM64) Bundle and DMG
        run: |
          ARM_APP_DIR="publish/mac-arm64/Bullet.app/Contents"
          mkdir -p "$ARM_APP_DIR/MacOS" "$ARM_APP_DIR/Resources/app"
          
          dotnet publish src/Bullet.Api/Bullet.Api.csproj -c Release -r osx-arm64 --self-contained true /p:PublishTrimmed=false -o "$ARM_APP_DIR/Resources/app"
          cp -R src/Bullet.Web/dist/* "$ARM_APP_DIR/Resources/app/wwwroot/"
          
          cp scripts/run-mac.sh "$ARM_APP_DIR/MacOS/Bullet"
          chmod +x "$ARM_APP_DIR/MacOS/Bullet"
          chmod +x "$ARM_APP_DIR/Resources/app/Bullet.Api"
          
          cat << 'EOF' > "$ARM_APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Bullet</string>
              <key>CFBundleIdentifier</key>
              <string>com.bullet.api</string>
              <key>CFBundleName</key>
              <string>BULLET</string>
              <key>CFBundleDisplayName</key>
              <string>BULLET</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Create drag-and-drop DMG
          mkdir -p dmg-staging-arm64
          cp -R publish/mac-arm64/Bullet.app dmg-staging-arm64/
          ln -s /Applications dmg-staging-arm64/Applications
          
          hdiutil create -volname "BULLET Installer" -srcfolder dmg-staging-arm64 -ov -format UDZO Bullet-macOS-AppleSilicon-Setup.dmg
          shasum -a 256 Bullet-macOS-AppleSilicon-Setup.dmg > Bullet-macOS-AppleSilicon-Setup.dmg.sha256
          
          # Also package portable ZIP with preserved unix permissions
          ditto -c -k --keepParent publish/mac-arm64/Bullet.app Bullet-macOS-AppleSilicon-arm64.zip
          shasum -a 256 Bullet-macOS-AppleSilicon-arm64.zip > Bullet-macOS-AppleSilicon-arm64.zip.sha256

      - name: Build & Package Intel (x64) Bundle and DMG
        run: |
          X64_APP_DIR="publish/mac-x64/Bullet.app/Contents"
          mkdir -p "$X64_APP_DIR/MacOS" "$X64_APP_DIR/Resources/app"
          
          dotnet publish src/Bullet.Api/Bullet.Api.csproj -c Release -r osx-x64 --self-contained true /p:PublishTrimmed=false -o "$X64_APP_DIR/Resources/app"
          cp -R src/Bullet.Web/dist/* "$X64_APP_DIR/Resources/app/wwwroot/"
          
          cp scripts/run-mac.sh "$X64_APP_DIR/MacOS/Bullet"
          chmod +x "$X64_APP_DIR/MacOS/Bullet"
          chmod +x "$X64_APP_DIR/Resources/app/Bullet.Api"
          
          cat << 'EOF' > "$X64_APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Bullet</string>
              <key>CFBundleIdentifier</key>
              <string>com.bullet.api</string>
              <key>CFBundleName</key>
              <string>BULLET</string>
              <key>CFBundleDisplayName</key>
              <string>BULLET</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          # Create drag-and-drop DMG
          mkdir -p dmg-staging-x64
          cp -R publish/mac-x64/Bullet.app dmg-staging-x64/
          ln -s /Applications dmg-staging-x64/Applications
          
          hdiutil create -volname "BULLET Installer" -srcfolder dmg-staging-x64 -ov -format UDZO Bullet-macOS-Intel-Setup.dmg
          shasum -a 256 Bullet-macOS-Intel-Setup.dmg > Bullet-macOS-Intel-Setup.dmg.sha256
          
          # Also package portable ZIP with preserved unix permissions
          ditto -c -k --keepParent publish/mac-x64/Bullet.app Bullet-macOS-Intel-x64.zip
          shasum -a 256 Bullet-macOS-Intel-x64.zip > Bullet-macOS-Intel-x64.zip.sha256

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bullet-macos-release-assets
          path: |
            Bullet-macOS-AppleSilicon-Setup.dmg
            Bullet-macOS-AppleSilicon-Setup.dmg.sha256
            Bullet-macOS-Intel-Setup.dmg
            Bullet-macOS-Intel-Setup.dmg.sha256
            Bullet-macOS-AppleSilicon-arm64.zip
            Bullet-macOS-AppleSilicon-arm64.zip.sha256
            Bullet-macOS-Intel-x64.zip
            Bullet-macOS-Intel-x64.zip.sha256

  release-desktop:
    name: Package & Release Desktop Executable
    needs: [lint-and-format, e2e-click-through-tests, docker-verification, package-macos]
    if: ((github.event_name == 'workflow_dispatch' && (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true || inputs.create_release)) || startsWith(github.ref, 'refs/tags/v')) && (github.actor == 'VishalViswanathan03' || github.triggering_actor == 'VishalViswanathan03')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS Release Assets
        uses: actions/download-artifact@v4
        with:
          name: bullet-macos-release-assets
          path: dist-macos/

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Production Frontend Assets
        working-directory: src/Bullet.Web
        run: |
          npm install
          npm run build

      - name: Copy Bundle to API and Desktop Hosts
        shell: pwsh
        run: |
          Copy-Item -Path "src/Bullet.Web/dist/*" -Destination "src/Bullet.Api/wwwroot" -Recurse -Force

      - name: Publish Standalone Windows Desktop App
        shell: pwsh
        run: |
          dotnet publish src/Bullet.Desktop/Bullet.Desktop.csproj -c Release -r win-x64 --self-contained false -o publish/desktop

      - name: Authenticode Sign Desktop Executable
        shell: pwsh
        run: |
          Write-Host "Configuring Authenticode Code Signing..."
          
          $cert = $null
          if ($env:CODE_SIGNING_PFX) {
            Write-Host "Found CODE_SIGNING_PFX secret. Importing production certificate..."
            $pfxBytes = [System.Convert]::FromBase64String($env:CODE_SIGNING_PFX)
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxBytes,
              $env:CODE_SIGNING_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
            )
          } else {
            Write-Host "Generating project Authenticode code-signing certificate for bulletapp..."
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=bulletapp, O=bulletapp, OU=Release Signing" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -HashAlgorithm SHA256 `
              -NotAfter (Get-Date).AddYears(5)
          }

          New-Item -ItemType Directory -Force -Path "dist-installer" | Out-Null
          Export-Certificate -Cert $cert -FilePath "dist-installer/Bullet-Release.cer" -Force
          Copy-Item "dist-installer/Bullet-Release.cer" -Destination "publish/desktop/Bullet-Release.cer" -Force

          if (Test-Path "publish/desktop/Bullet.exe") {
            Write-Host "Signing publish/desktop/Bullet.exe with DigiCert timestamp..."
            $sig = Set-AuthenticodeSignature `
              -FilePath "publish/desktop/Bullet.exe" `
              -Certificate $cert `
              -TimestampServer "http://timestamp.digicert.com" `
              -HashAlgorithm SHA256 `
              -IncludeChain All
            Write-Host "Desktop signature status: $($sig.Status)"
          }
        env:
          CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}

      - name: Create Release Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/desktop/* -DestinationPath Bullet-Desktop-Windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 Bullet-Desktop-Windows-x64.zip).Hash
          "$hash  Bullet-Desktop-Windows-x64.zip" | Out-File -Encoding utf8 Bullet-Desktop-Windows-x64.zip.sha256

      - name: Install Inno Setup Compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Single-File Windows Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/Bullet.iss

      - name: Authenticode Sign Setup Installer
        shell: pwsh
        run: |
          $cert = (Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -like "*bulletapp*" -or $_.Subject -like "*BULLET Open Source Project*" -or $_.Subject -like "*VishalViswanathan03*" } | Select-Object -First 1)
          if ($cert -and (Test-Path "dist-installer/Bullet-Setup.exe")) {
            Write-Host "Signing dist-installer/Bullet-Setup.exe with DigiCert timestamp and full chain..."
            $sig = Set-AuthenticodeSignature `
              -FilePath "dist-installer/Bullet-Setup.exe" `
              -Certificate $cert `
              -TimestampServer "http://timestamp.digicert.com" `
              -HashAlgorithm SHA256 `
              -IncludeChain All
            Write-Host "Installer signature status: $($sig.Status)"
          }
          
          if (Test-Path "installer/Install-Certificate.bat") {
            Copy-Item "installer/Install-Certificate.bat" -Destination "dist-installer/Install-Certificate.bat" -Force
          }
          
          $hash = (Get-FileHash -Algorithm SHA256 dist-installer/Bullet-Setup.exe).Hash
          "$hash  Bullet-Setup.exe" | Out-File -Encoding utf8 dist-installer/Bullet-Setup.exe.sha256

          $ver = "${{ github.event.inputs.release_version || github.ref_name }}"
          if ($ver -and (Test-Path "dist-installer/Bullet-Setup.exe")) {
            Copy-Item "dist-installer/Bullet-Setup.exe" -Destination "dist-installer/Bullet-Setup-$ver.exe" -Force
            $verHash = (Get-FileHash -Algorithm SHA256 "dist-installer/Bullet-Setup-$ver.exe").Hash
            "$verHash  Bullet-Setup-$ver.exe" | Out-File -Encoding utf8 "dist-installer/Bullet-Setup-$ver.exe.sha256"
          }
          if ($ver -and (Test-Path "Bullet-Desktop-Windows-x64.zip")) {
            Copy-Item "Bullet-Desktop-Windows-x64.zip" -Destination "Bullet-Windows-Portable-$ver.zip" -Force
            $zipVerHash = (Get-FileHash -Algorithm SHA256 "Bullet-Windows-Portable-$ver.zip").Hash
            "$zipVerHash  Bullet-Windows-Portable-$ver.zip" | Out-File -Encoding utf8 "Bullet-Windows-Portable-$ver.zip.sha256"
          }

      - name: Generate Release Notes & Changelog
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.release_version || github.ref_name }}"
          Write-Host "Compiling release notes and changelog for $ver..."
          
          # Check for previous release tag
          $prevTag = git describe --tags --abbrev=0 "$ver^" 2>$null
          if (-not $prevTag) {
            $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          }
          
          $changelog = ""
          $formatCommitLine = {
            param($line)
            if (-not $line) { return $null }
            $parts = $line.Split('|')
            $msg = $parts[0]
            $hash = $parts[1]
            $fullHash = $parts[2]
            $author = $parts[3]
            $email = $parts[4]
            $mention = "by $author"
            if ($author -eq "VishalViswanathan" -or $email -eq "vishalvn2003@gmail.com" -or $author -like "*Vishal*") {
              $mention = "by @${{ github.repository_owner }}"
            }
            return "* $msg ([$hash](https://github.com/${{ github.repository }}/commit/$fullHash)) $mention"
          }

          if ($prevTag) {
            Write-Host "Found previous tag: $prevTag"
            $rawList = git log "$prevTag..HEAD" --pretty=format:"%s|%h|%H|%an|%ae"
            $commitList = ($rawList | ForEach-Object { & $formatCommitLine $_ }) -join "`n"
            $changelog = "#### Commits since $prevTag`n`n$commitList"
          } else {
            Write-Host "No previous tag found. Generating recent commit history..."
            $rawList = git log -n 100 --pretty=format:"%s|%h|%H|%an|%ae"
            $commitList = ($rawList | ForEach-Object { & $formatCommitLine $_ }) -join "`n"
            $changelog = "#### Commits Included in this Release`n`n$commitList"
          }

          $installerHash = ""
          if (Test-Path "dist-installer/Bullet-Setup.exe.sha256") {
            $installerHash = (Get-Content "dist-installer/Bullet-Setup.exe.sha256" -Raw).Trim()
          }

          $zipHash = ""
          if (Test-Path "Bullet-Desktop-Windows-x64.zip.sha256") {
            $zipHash = (Get-Content "Bullet-Desktop-Windows-x64.zip.sha256" -Raw).Trim()
          }

          # Import and read macOS assets from package-macos job
          $macArmDmgHash = ""
          if (Test-Path "dist-macos/Bullet-macOS-AppleSilicon-Setup.dmg.sha256") {
            $macArmDmgHash = (Get-Content "dist-macos/Bullet-macOS-AppleSilicon-Setup.dmg.sha256" -Raw).Trim()
            Copy-Item "dist-macos/Bullet-macOS-AppleSilicon-Setup.dmg*" . -Force
          }

          $macX64DmgHash = ""
          if (Test-Path "dist-macos/Bullet-macOS-Intel-Setup.dmg.sha256") {
            $macX64DmgHash = (Get-Content "dist-macos/Bullet-macOS-Intel-Setup.dmg.sha256" -Raw).Trim()
            Copy-Item "dist-macos/Bullet-macOS-Intel-Setup.dmg*" . -Force
          }

          $macArmZipHash = ""
          if (Test-Path "dist-macos/Bullet-macOS-AppleSilicon-arm64.zip.sha256") {
            $macArmZipHash = (Get-Content "dist-macos/Bullet-macOS-AppleSilicon-arm64.zip.sha256" -Raw).Trim()
            Copy-Item "dist-macos/Bullet-macOS-AppleSilicon-arm64.zip*" . -Force
          }

          $macX64ZipHash = ""
          if (Test-Path "dist-macos/Bullet-macOS-Intel-x64.zip.sha256") {
            $macX64ZipHash = (Get-Content "dist-macos/Bullet-macOS-Intel-x64.zip.sha256" -Raw).Trim()
            Copy-Item "dist-macos/Bullet-macOS-Intel-x64.zip*" . -Force
          }

          $lines = @(
            "## 🚀 BULLET Release $ver",
            "*Load. Aim. API.*",
            "",
            "### 📋 Changelog",
            $changelog,
            "",
            "> View the full curated release history in the repository [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).",
            "",
            "---",
            "",
            "### 📦 Release Packages & Checksums",
            "",
            "| Package | OS / Platform | Description |",
            "|---|---|---|",
            "| **[Bullet-Setup.exe](https://github.com/${{ github.repository }}/releases/download/$ver/Bullet-Setup.exe)** | Windows x64 (Setup) | Single-file Windows setup installer with desktop shortcuts and auto-launch |",
            "| **[Bullet-macOS-AppleSilicon-Setup.dmg](https://github.com/${{ github.repository }}/releases/download/$ver/Bullet-macOS-AppleSilicon-Setup.dmg)** | macOS (Apple Silicon M1-M5) | 1-Click Drag-and-Drop installer disk image (100% self-contained, zero .NET required) |",
            "| **[Bullet-macOS-Intel-Setup.dmg](https://github.com/${{ github.repository }}/releases/download/$ver/Bullet-macOS-Intel-Setup.dmg)** | macOS (Intel x64) | 1-Click Drag-and-Drop installer disk image (100% self-contained, zero .NET required) |",
            "| **[Bullet-Desktop-Windows-x64.zip](https://github.com/${{ github.repository }}/releases/download/$ver/Bullet-Desktop-Windows-x64.zip)** | Windows x64 (Portable) | Portable zero-install package containing standalone executable and bundled assets |",
            "| **[Bullet-macOS-AppleSilicon-arm64.zip](https://github.com/${{ github.repository }}/releases/download/$ver/Bullet-macOS-AppleSilicon-arm64.zip)** | macOS (Apple Silicon) | Native Apple Silicon portable bundle with preserved execution permissions |",
            "| **[Bullet-macOS-Intel-x64.zip](https://github.com/${{ github.repository }}/releases/download/$ver/Bullet-macOS-Intel-x64.zip)** | macOS (Intel x64) | Native Intel Mac portable bundle with preserved execution permissions |",
            "| **[Bullet-Release.cer](https://github.com/${{ github.repository }}/releases/download/$ver/Bullet-Release.cer)** | All | Authenticode public certificate for publisher identity verification |",
            "| **[Install-Certificate.bat](https://github.com/${{ github.repository }}/releases/download/$ver/Install-Certificate.bat)** | Windows | 1-Click script to trust the publisher certificate and eliminate SmartScreen blocks |",
            "",
            "#### 🛡️ macOS & Windows Security Guidance",
            "> - **macOS**: Because BULLET is newly released open-source software, right-click `Bullet.app` in `/Applications` and select **Open**, or run `sudo xattr -rd com.apple.quarantine /Applications/Bullet.app` in Terminal.",
            "> - **Windows**: If SmartScreen prompts, click **More info** -> **Run anyway**, or run `Install-Certificate.bat` to trust the publisher certificate.",
            "",
            "#### 🔐 SHA256 Verification Hashes",
            '```text',
            $installerHash,
            $zipHash,
            $macArmDmgHash,
            $macX64DmgHash,
            $macArmZipHash,
            $macX64ZipHash,
            '```'
          )

          $body = $lines -join "`n"
          [System.IO.File]::WriteAllText("release_notes.md", $body, [System.Text.Encoding]::UTF8)
          Write-Host "Release notes generated successfully:"
          Get-Content release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name }}
          name: BULLET ${{ github.event.inputs.release_version || github.ref_name }}
          draft: false
          prerelease: false
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            dist-installer/Bullet-Setup.exe
            dist-installer/Bullet-Setup.exe.sha256
            dist-installer/Bullet-Setup-*.exe
            dist-installer/Bullet-Setup-*.exe.sha256
            Bullet-Desktop-Windows-x64.zip
            Bullet-Desktop-Windows-x64.zip.sha256
            Bullet-Windows-Portable-*.zip
            Bullet-Windows-Portable-*.zip.sha256
            Bullet-macOS-AppleSilicon-Setup.dmg
            Bullet-macOS-AppleSilicon-Setup.dmg.sha256
            Bullet-macOS-Intel-Setup.dmg
            Bullet-macOS-Intel-Setup.dmg.sha256
            Bullet-macOS-AppleSilicon-arm64.zip
            Bullet-macOS-AppleSilicon-arm64.zip.sha256
            Bullet-macOS-Intel-x64.zip
            Bullet-macOS-Intel-x64.zip.sha256
            dist-installer/Bullet-Release.cer
            dist-installer/Install-Certificate.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
